name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > keystore.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            gradle :app:assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEY_PASSWORD \
              -Pandroid.injected.signing.key.alias=key0 \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          else
            gradle :app:assembleRelease
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "extVersion=" gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK to .eapk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "bandcamp-${{ steps.version.outputs.version }}.eapk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bandcamp Extension v${{ steps.version.outputs.version }}
          files: "*.eapk"
          body: |
            ## Bandcamp Extension for Echo
            Download the .eapk file, open on Android, select Echo.
